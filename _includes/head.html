<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign t = site.data[page.lang] %}
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.lab.name }}</title>
  <meta name="description" content="{{ site.lab.fullname[page.lang] }} — {{ site.lab.institution[page.lang] }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/img/logos/favicon.png' | relative_url }}">
</head>
