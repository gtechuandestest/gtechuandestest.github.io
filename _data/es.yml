news:
  templates:
    defensa:
      - "{nombre} defendió su memoria, «{titulo}», guiada por {profesores}."
      - "Nueva defensa en el grupo: {nombre} presentó «{titulo}», bajo la guía de {profesores}."
      - "{nombre} cerró su etapa de tesista defendiendo «{titulo}». La guiaron {profesores}."
      - "Con «{titulo}», {nombre} defendió su memoria ante la comisión. Guía: {profesores}."
    titulacion:
      - "{nombre} recibió su título. La guiaron {profesores}."
      - "Ceremonia de titulación de {nombre}, tesista de {profesores}."
    premio:
      - "{nombre} recibió el {premio}."
      - "El {premio} fue para {nombre}."
      - "Reconocimiento para {nombre}: {premio}."
    congreso:
      - "{nombre} presentó «{contribucion}» en el {congreso}, en {lugar}."
      - "El grupo estuvo en el {congreso} ({lugar}): {nombre} expuso «{contribucion}»."
      - "En {lugar}, {nombre} llevó «{contribucion}» al {congreso}."
    proyecto:
      - "{nombre} se adjudicó el {proyecto}."
      - "Nuevo proyecto en el grupo: {nombre} dirige el {proyecto}."
