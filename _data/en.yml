news:
  templates:
    defensa:
      - "{nombre} defended their thesis, \"{titulo}\", supervised by {profesores}."
      - "A new defence in the group: {nombre} presented \"{titulo}\", supervised by {profesores}."
      - "{nombre} closed their time as a student researcher defending \"{titulo}\". Supervisors: {profesores}."
      - "With \"{titulo}\", {nombre} defended before the committee. Supervised by {profesores}."
    titulacion:
      - "{nombre} graduated. Supervised by {profesores}."
      - "Graduation ceremony for {nombre}, student researcher with {profesores}."
    premio:
      - "{nombre} received the {premio}."
      - "The {premio} went to {nombre}."
      - "Recognition for {nombre}: {premio}."
    congreso:
      - "{nombre} presented \"{contribucion}\" at {congreso}, in {lugar}."
      - "The group attended {congreso} ({lugar}): {nombre} presented \"{contribucion}\"."
      - "In {lugar}, {nombre} took \"{contribucion}\" to {congreso}."
    proyecto:
      - "{nombre} was awarded the {proyecto}."
      - "A new project in the group: {nombre} leads the {proyecto}."
