    en: "César Huiliñir directs the PhD programme in Engineering Sciences at Universidad de los Andes. Following a postdoctoral fellowship at Technische Universität Berlin, he has spent two decades working on the biological treatment of water and waste and on the mathematical modelling of the bioprocesses behind it, spanning anaerobic digestion, nitrogen removal and organic-waste valorisation, with more than 85 indexed publications and two patents."
