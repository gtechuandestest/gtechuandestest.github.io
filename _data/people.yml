# ---- Equipo del área de aguas (traído del sitio de aguas; se mantiene con herramientas/migrar-aguas.rb) ----

- id: felipe-carreno
  group: postdoc
  areas: [aguas]
  name: "Felipe A. Carreño López"
  photo: "felipe-carreno.jpg"
  role:
    es: "Investigador Postdoctoral"
    en: "Postdoctoral Researcher"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctor en Ciencias de la Ingeniería, Universidad de los Andes · Ingeniero Civil Químico, Universidad de Santiago de Chile"
    en: "PhD in Engineering Sciences, Universidad de los Andes · Chemical Civil Engineer, Universidad de Santiago de Chile"
  bio:
    es: >-
      En el Fondecyt de Postdoctorado N.º 3250412, que dirige, estudia cómo se
      comportan la biopelícula y el azufre elemental dentro de un biofiltro de
      desnitrificación autótrofa para aguas subterráneas. Simula el reactor con
      dinámica de fluidos computacional y contrasta los resultados con técnicas de
      imagen digital, para entender qué gobierna su rendimiento: cómo circula el flujo
      entre las partículas, dónde crece la biopelícula y cómo se consume el azufre.
      Aporta al grupo la capa de modelación —CFD, distribuciones de tiempo de
      residencia, acoplamiento CFD–DEM— que convierte los ensayos de laboratorio en
      herramientas de diseño, con colaboraciones en la University of California, Davis
      y la Universidad de Valladolid.
    en: >-
      In Fondecyt Postdoctoral grant No. 3250412, which he leads, he studies how
      biofilm and elemental sulfur behave inside an autotrophic denitrification
      biofilter for groundwater. He simulates the reactor with computational fluid
      dynamics and contrasts the results with digital imaging, to work out what governs
      its performance: how flow moves between the particles, where biofilm grows and
      how the sulfur is consumed. He brings the group its modelling layer — CFD,
      residence time distributions, CFD–DEM coupling — that turns laboratory trials
      into design tools, with collaborations at the University of California, Davis and
      Universidad de Valladolid.
  interests:
    es: ["CFD y OpenFOAM", "Biopelículas en medios porosos", "Distribución de tiempos de residencia", "Acoplamiento CFD–DEM", "Gemelos digitales de reactores"]
    en: ["CFD and OpenFOAM", "Biofilms in porous media", "Residence time distributions", "CFD–DEM coupling", "Digital twins of reactors"]
  metrics:
    - { label: { es: "Publicaciones", en: "Publications" }, value: "4" }
    - { label: { es: "Índice h", en: "h-index" }, value: "2" }
    - { label: { es: "Citas", en: "Citations" }, value: "30" }
  links:
    email: "facarreno@miuandes.cl"
    orcid: "0000-0002-5255-2363"
    linkedin: "faclopez91"
    scholar: "https://scholar.google.com/citations?user=OsNFId8AAAAJ"
    github: "facarreno"
    website: "https://facarreno.github.io"

