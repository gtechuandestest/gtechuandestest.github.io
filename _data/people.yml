- id: alberto-vergara
  group: lead
  areas: [vergara]
  name: "Alberto Vergara Fernández"
  photo: ""
  role:
    es: "Profesor Titular · Director del área de Biofiltración y Tratamiento de Gases"
    en: "Full Professor · Head of Gas Biofiltration and Treatment"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Doctor en Ciencias de la Ingeniería Química, Universidad Autónoma Metropolitana – Iztapalapa (México) · Ingeniero Civil Bioquímico, Pontificia Universidad Católica de Valparaíso"
    en: "PhD in Chemical Engineering Sciences, Universidad Autónoma Metropolitana – Iztapalapa (Mexico) · Biochemical Engineering, Pontificia Universidad Católica de Valparaíso"
  bio:
    es: "Alberto Vergara-Fernández es fundador del Green Technologies Research Group y Profesor Titular de la Facultad de Ingeniería y Ciencias Aplicadas. Su trabajo se centra en la biofiltración de gases: hongos filamentosos puestos a degradar compuestos volátiles hidrofóbicos, biorreactores de alta transferencia de masa y el modelado matemático que permite escalarlos. Ha sido investigador y profesor visitante en la Universidad Autónoma Metropolitana (México), la Universidad de Valladolid (España) y la Universidad Pontificia Bolivariana (Colombia). Dirigió el Anillo ATE220045 sobre valorización de CO₂ con hidrógeno verde y es coautor de dos patentes de purificación de aire de interiores."
    en: "Alberto Vergara-Fernández founded the Green Technologies Research Group and is a Full Professor in the Faculty of Engineering and Applied Sciences. His work centres on gas biofiltration: filamentous fungi put to work degrading hydrophobic volatile compounds, high-mass-transfer bioreactors and the mathematical modelling that makes scale-up possible. He has been a visiting researcher and professor at Universidad Autónoma Metropolitana (Mexico), Universidad de Valladolid (Spain) and Universidad Pontificia Bolivariana (Colombia). He directed the ATE220045 Anillo project on CO₂ upcycling with green hydrogen and co-holds two patents on indoor air purification."
  interests:
    es: ["Biofiltración de gases", "Hongos filamentosos", "Biorreactores de alta transferencia de masa", "Tratamiento de aire de interiores", "Modelación de sistemas biológicos"]
    en: ["Gas biofiltration", "Filamentous fungi", "High-mass-transfer bioreactors", "Indoor air treatment", "Modelling of biological systems"]
  metrics:
