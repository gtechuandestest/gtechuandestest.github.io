  bio:
    es: "Patricio Moreno-Casas aborda problemas de importancia ambiental desde la modelación numérica de flujos complejos. Su especialidad son los flujos con más de una fase —sólidos, líquidos y gases— simulados con CFD, DEM y el acoplamiento de ambos. En los últimos años ha trabajado en la resuspensión de sedimentos en lagos por acción de las olas, en simulaciones a microescala de partículas sedimentarias en flujos turbulentos y en el transporte de contaminantes en flujos de aire a través de medios porosos, incluido el desempeño de biofiltros. Se incorporó a la Universidad de los Andes en 2014."
    en: "Patricio Moreno-Casas approaches environmentally significant problems through the numerical modelling of complex flows. His speciality is flows with more than one phase —solids, liquids and gases— simulated with CFD, DEM and the coupling of the two. In recent years he has worked on wave-driven sediment resuspension in lakes, microscale simulations of sedimentary particles in turbulent flows, and pollutant transport in air flows through porous media, including biofilter performance. He joined Universidad de los Andes in 2014."
