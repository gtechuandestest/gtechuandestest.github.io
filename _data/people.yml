  bio:
    es: "Felipe Scott es Vicedecano Académico de la Facultad de Ingeniería y Ciencias Aplicadas y Director del Doctorado en Ciencias de la Ingeniería. Trabaja en ingeniería de bioprocesos, donde combina ingeniería metabólica, fermentación de precisión y modelación a escala genómica para convertir H₂, CO₂ y O₂ en productos químicos de valor. La otra mitad de su trabajo es el diseño y la optimización de procesos, incluido el abatimiento de contaminación atmosférica por biofiltración con bacterias y hongos. Ha sido consultor internacional, evaluador de proyectos dentro y fuera de Chile y miembro del Grupo de Estudio de Fondecyt."
    en: "Felipe Scott is Academic Vice Dean of the Faculty of Engineering and Applied Sciences and director of the PhD programme in Engineering Sciences. He works in bioprocess engineering, combining metabolic engineering, precision fermentation and genome-scale modelling to turn H₂, CO₂ and O₂ into value-added chemicals. The other half of his work is process design and optimisation, including air pollution abatement by biofiltration with bacteria and fungi. He has served as an international consultant, a project evaluator in Chile and abroad, and a member of the Fondecyt study group."
