- id: sichem-guerrero
  group: lead
  areas: [guerrero]
  name: "Sichem Guerrero Ruz"
  photo: ""
  role:
    es: "Profesor Titular · Director del área de Catálisis Heterogénea"
    en: "Full Professor · Head of Heterogeneous Catalysis"
  affiliation:
    es: "Facultad de Ingeniería y Ciencias Aplicadas, Universidad de los Andes"
    en: "Faculty of Engineering and Applied Sciences, Universidad de los Andes"
  degree:
    es: "Ph.D. en Ingeniería Química, University of Notre Dame (EE.UU.) · Ingeniero Civil Químico y Magíster en Ingeniería Civil Química, Universidad de Chile"
    en: "PhD in Chemical Engineering, University of Notre Dame (USA) · Chemical Engineering and MSc in Chemical Engineering, Universidad de Chile"
  bio:
    es: "Sichem Guerrero es Profesor Titular de la Facultad de Ingeniería y Ciencias Aplicadas y coordinador de la carrera de Ingeniería Civil Ambiental. Su área es la catálisis heterogénea: sintetiza catalizadores, los ensaya en reacciones de interés aplicado y los caracteriza con técnicas físicas y espectroscópicas. Entre esas reacciones están la reducción de óxido nítrico con absorbentes en base a cobre, la eliminación de contaminantes provenientes de la combustión de leña, la absorción y activación de CO₂ y la producción catalítica de biodiésel."
    en: "Sichem Guerrero is a Full Professor in the Faculty of Engineering and Applied Sciences and coordinator of the Environmental Civil Engineering programme. His field is heterogeneous catalysis: he synthesises catalysts, tests them in reactions of applied interest and characterises them with physical and spectroscopic techniques. Those reactions include nitric oxide reduction over copper-based absorbents, the removal of pollutants from wood combustion, CO₂ absorption and activation, and catalytic biodiesel production."
  interests:
    es: ["Catálisis heterogénea", "Reducción de óxido nítrico", "Absorción y activación de CO₂", "Combustión de leña", "Producción catalítica de biodiésel"]
    en: ["Heterogeneous catalysis", "Nitric oxide reduction", "CO₂ absorption and activation", "Wood combustion", "Catalytic biodiesel production"]
