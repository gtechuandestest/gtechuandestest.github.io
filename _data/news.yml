# Noticias del carrusel. El texto NO se escribe: se elige una plantilla de
# news.templates en es.yml / en.yml con el campo `template` (el índice empieza
# en 0). Al agregar una noticia, usa un índice distinto al de la anterior del
# mismo tipo, para que dos seguidas no repitan la fórmula.
#
# kind: defensa | titulacion | premio | congreso | proyecto
# Marcadores por tipo: ver informacion/LEEME.md
# `nombre` y `congreso` aceptan un texto único o uno por idioma ({es:, en:}).
# `texto` ({es:, en:}) reemplaza la plantilla cuando una noticia necesita su
# propia frase; admite los mismos marcadores. Úsalo solo como excepción.
# La hora de `date` no se muestra: solo ordena las noticias del mismo día.

# --- I Congreso Chileno de Bioprocesos (Talca, 26–30 oct 2026) -------------
