# Noticias del carrusel. El texto NO se escribe: se elige una plantilla de
# news.templates en es.yml / en.yml con el campo `template` (el índice empieza
# en 0). Al agregar una noticia, usa un índice distinto al de la anterior del
# mismo tipo, para que dos seguidas no repitan la fórmula.
#
# kind: defensa | titulacion | premio | congreso | proyecto | publicacion
# Marcadores por tipo: ver informacion/LEEME.md
# Todos los marcadores (`nombre`, `titulo`, `profesores`, `premio`, `congreso`,
# `contribucion`, `lugar`, `proyecto`, `revista`) aceptan un texto único o uno por idioma
# ({es:, en:}).
# `extra` ({es:, en:}): frase opcional que se agrega al final del párrafo.
# `link` + `link_label` ({es:, en:}): enlace opcional bajo el texto.
# `date_label` ({es:, en:}): solo cuando la fecha exacta no se conoce (p. ej.
# "2025"); reemplaza la fecha que se muestra. `date` sigue ordenando.
# Ojo con las plantillas: «de {profesores}» con «el profesor…» da «de el», y
# «La guiaron {profesores}» pide plural. Con un solo profesor, usa la 0 o la 3.
# `texto` ({es:, en:}) reemplaza la plantilla cuando una noticia necesita su
# propia frase; admite los mismos marcadores. Úsalo solo como excepción.
# La hora de `date` no se muestra: solo ordena las noticias del mismo día.

